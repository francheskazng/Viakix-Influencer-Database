<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Viakix Influencer Database (Demo)</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <div class="header-left">
        <img src="assets/viakix-logo.svg" alt="VIAKIX Logo" class="logo" />
        <div class="header-title">
          <h1>Viakix Influencer Database (Demo)</h1>
          <small>Simple editable demo — inline edits saved to Supabase</small>
        </div>
      </div>
      <div class="header-right">
        <input id="email" class="input" placeholder="you@company.com" style="width:220px;" />
        <button id="signin" class="btn btn-primary">Send magic link</button>
        <button id="signout" class="btn btn-secondary" style="display:none">Sign out</button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- List View -->
    <div id="list-view">
      <!-- Controls Bar -->
      <div class="controls-bar">
        <div class="controls-group">
          <label for="state-filter">State:</label>
          <select id="state-filter" class="input">
            <option value="All">All States</option>
          </select>
        </div>
        
        <div class="controls-group">
          <label for="search-input">Search:</label>
          <input type="text" id="search-input" class="input input-search" placeholder="Filter by name or handle..." />
        </div>
        
        <div class="controls-group" style="margin-left: auto;">
          <button id="refresh" class="btn btn-secondary">Refresh</button>
          
          <div class="dropdown" id="export-dropdown">
            <button id="export-toggle" class="btn btn-primary dropdown-toggle">
              Export CSV ▾
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-label">Export Mode</div>
              <button class="dropdown-item" id="export-selected">
                Selected for Outreach (default)
              </button>
              <button class="dropdown-item" id="export-filtered">
                Currently Filtered Results
              </button>
              <button class="dropdown-item" id="export-all">
                All Influencers
              </button>
              <div class="dropdown-divider"></div>
              <div style="padding: 8px 12px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;">
                  <input type="checkbox" id="mark-contacted" />
                  Mark exported as contacted
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div id="table-container">
        <div class="loading">Loading influencers...</div>
      </div>

      <!-- Pagination -->
      <div id="pagination"></div>
    </div>

    <!-- Detail/Edit View -->
    <div id="detail-view" class="detail-view hidden">
      <div id="detail-content"></div>
    </div>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
