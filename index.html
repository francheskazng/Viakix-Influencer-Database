<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Viakix Influencer Database — Demo</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-left">
        <img src="assets/viakix-logo.svg" alt="Viakix Logo" class="logo" />
        <div class="header-title">
          <h1>Viakix Influencer Database (Demo)</h1>
          <small>Simple editable demo — inline edits saved to Supabase</small>
        </div>
      </div>
      <div id="auth-area">
        <input id="email" class="input" placeholder="you@company.com" style="width:220px" />
        <button id="signin" class="btn">Send magic link</button>
        <button id="signout" class="btn secondary" style="display:none">Sign out</button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- List View -->
    <div id="list-view">
      <div class="controls">
        <div class="controls-row">
          <select id="state-filter" class="input" style="width: 200px">
            <option value="">All states</option>
          </select>
          <input id="search-box" class="input" placeholder="Search by name or handle..." style="width: 300px" />
          <button id="refresh" class="btn secondary">Refresh</button>
          <button id="export" class="btn">Export CSV</button>
        </div>
      </div>
      
      <div id="table-wrap">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <!-- Detail View (hidden by default) -->
    <div id="detail-view" class="hidden">
      <!-- Detail form will be rendered here by JavaScript -->
    </div>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
