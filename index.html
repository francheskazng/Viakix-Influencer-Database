<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Viakix Influencer Database (Demo)</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="container">
    <header class="header card">
      <div class="brand">
        <!-- If you prefer PNG logo, use /assets/viakix-logo.png -->
        <img src="/assets/viakix-logo.svg" alt="VIAKIX" class="logo" />
        <div>
          <h1 class="title">Viakix Influencer Database (Demo)</h1>
          <p class="subtitle">Simple editable demo — inline edits saved to Supabase</p>
        </div>
      </div>

      <div class="auth-controls">
        <input id="auth-email" placeholder="you@company.com" type="email" />
        <button id="send-magic" class="btn primary">Send magic link</button>
      </div>
    </header>

    <main id="app" class="card">
      <section class="controls-row">
        <div class="filters">
          <select id="state-filter">
            <option value="__all">All states</option>
          </select>

          <select id="category-filter">
            <option value="__all">All categories</option>
          </select>

          <input id="search-input" placeholder="Search account name or social URL" />
          <button id="refresh-btn" class="btn">Refresh</button>
        </div>

        <div class="export-actions">
          <div class="export-group">
            <button id="export-btn" class="btn primary">Export Selected for Outreach</button>
            <select id="export-mode" title="Export mode">
              <option value="selected">Export Selected for Outreach</option>
              <option value="filtered">Export Filtered</option>
              <option value="all">Export All</option>
            </select>
            <label class="inline"><input id="mark-contacted" type="checkbox" /> Mark exported as contacted</label>
          </div>
        </div>
      </section>

      <section id="list-view" class="list-view">
        <div class="table-wrapper" id="table-wrapper">
          <!-- table rendered by JS -->
        </div>

        <div class="pagination" id="pagination"></div>
      </section>

      <section id="detail-view" class="detail-view hidden">
        <!-- detail/edit view rendered by JS -->
      </section>
    </main>
  </div>

  <!-- Supabase settings (demo/public anon key) -->
  <script>

  <!-- App script (must run after the two scripts above) -->
  <script src="/assets/app.js"></script>
</body>
</html>
